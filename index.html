<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mind Matrix | Advanced Neural Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00f2ff;
      --neon-purple: #bc13fe;
      --neon-red: #ff3131;
      --glass-bg: rgba(10, 10, 15, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --bg-color: #020205;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --scrollbar-thumb: rgba(255, 255, 255, 0.1);
    }

    body.light-mode {
      --glass-bg: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(0, 0, 0, 0.2);
      --bg-color: #ffffff;
      --text-color: #000000; /* Deep black */
      --text-muted: #111111; /* Very dark black-grey */
      --scrollbar-thumb: #000000; /* Solid black scrollbar */
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      margin: 0;
      height: 100vh;
      width: 100vw;
    }

    /* Force text color in light mode for all children to ensure deep black visibility */
    body.light-mode p, 
    body.light-mode span, 
    body.light-mode h1, 
    body.light-mode h2, 
    body.light-mode h3, 
    body.light-mode h4, 
    body.light-mode input, 
    body.light-mode textarea, 
    body.light-mode button {
      color: #000000 !important;
    }

    /* Permanent Glitch Effect Logo */
    .glitch-logo {
      font-family: 'Orbitron', sans-serif;
      position: relative;
      color: var(--neon-blue);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 900;
      text-shadow: 0 0 15px rgba(0, 242, 255, 0.9);
      display: inline-block;
    }

    .glitch-logo::before,
    .glitch-logo::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .glitch-logo::before {
      left: 2px;
      text-shadow: -2px 0 #ff00c1;
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim 5s infinite linear alternate-reverse;
    }

    .glitch-logo::after {
      left: -2px;
      text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
      animation: glitch-anim2 1s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(31px, 9999px, 94px, 0); }
      20% { clip: rect(85px, 9999px, 140px, 0); }
      40% { clip: rect(10px, 9999px, 50px, 0); }
      60% { clip: rect(67px, 9999px, 62px, 0); }
      80% { clip: rect(40px, 9999px, 90px, 0); }
      100% { clip: rect(67px, 9999px, 62px, 0); }
    }

    @keyframes glitch-anim2 {
      0% { clip: rect(65px, 9999px, 100px, 0); }
      100% { clip: rect(10px, 9999px, 30px, 0); }
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { 
      background: var(--scrollbar-thumb); 
      border-radius: 10px; 
    }
    ::-webkit-scrollbar-track { background: transparent; }

    #root { height: 100vh; width: 100vw; }
  </style>
